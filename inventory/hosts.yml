---
# Add machines under the matching group, then run:
#   ansible-playbook playbooks/bootstrap.yml --limit servers
#   ansible-playbook playbooks/bootstrap.yml --limit laptops

all:
  children:
    laptops:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    servers:
      hosts:
