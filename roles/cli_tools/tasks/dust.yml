---
- name: Ensure dust extract directory exists
  ansible.builtin.file:
    path: /tmp/dust_extract
    state: directory
    mode: "0755"

- name: Download dust archive
  ansible.builtin.get_url:
    url: >-
      https://github.com/bootandy/dust/releases/download/v{{ dust_version }}/dust-v{{ dust_version }}-{{ cli_arch_gnu }}-unknown-linux-gnu.tar.gz
    dest: /tmp/dust.tar.gz
    mode: "0644"

- name: Unpack dust archive
  ansible.builtin.unarchive:
    src: /tmp/dust.tar.gz
    dest: /tmp/dust_extract
    remote_src: true
    extra_opts:
      - --strip-components=1

- name: Install dust binary
  ansible.builtin.copy:
    src: /tmp/dust_extract/dust
    dest: "{{ cli_install_dir }}/dust"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Cleanup dust temp files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/dust.tar.gz
    - /tmp/dust_extract
